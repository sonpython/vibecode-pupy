services:
  usage-api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data

  codex-collector:
    build:
      context: ../collectors/codex
    restart: unless-stopped
    env_file: .env
    environment:
      USAGE_API_URL: http://usage-api:8080
      CODEX_AUTH_FILE: /secrets/codex_auth.json
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-300}
      AUTH_ALERT_WEBHOOK: ${AUTH_ALERT_WEBHOOK:-}
    volumes:
      - ../secrets:/secrets:ro
    depends_on:
      - usage-api

  codex-session-keeper:
    build:
      context: ../collectors/codex
      dockerfile: Dockerfile.playwright
    restart: unless-stopped
    environment:
      CODEX_AUTH_FILE: /secrets/codex_auth.json
      KEEPALIVE_INTERVAL_SEC: ${CODEX_KEEPALIVE_INTERVAL_SEC:-900}
    volumes:
      - ../secrets:/secrets:ro

  claude-collector:
    build:
      context: ../collectors/claude
    restart: unless-stopped
    env_file: .env
    environment:
      USAGE_API_URL: http://usage-api:8080
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-300}
    volumes:
      - ${HOME}/.claude:/root/.claude:ro
    depends_on:
      - usage-api

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - usage-api
